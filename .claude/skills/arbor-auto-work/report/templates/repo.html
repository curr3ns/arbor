<section class="repo" id="$rid">
<div class="rcard">
<div class="rtop">
<h3>$name</h3>
<span class="branch" title="Branch"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.5 2.5 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/></svg>$branch</span>
<span class="rstate $pushcls"><i></i>$pushed</span>
</div>
<div class="rmeta">
<span class="rm"><b>$filecount</b> files</span>
<span class="rm">base <code>$base</code></span>
<span class="rm churn"><span class="a">+$added</span><span class="r">&minus;$removed</span><span class="cbar" aria-hidden="true"><i style="width:$addpct%"></i></span></span>
</div>
$commits
</div>
<div class="dbar">
<input class="filter" type="search" placeholder="Filter files…  ( / )" aria-label="Filter files">
<div class="seg" role="group" aria-label="Diff layout"><button type="button" data-view="u" class="on">Unified</button><button type="button" data-view="s">Split</button></div>
<button type="button" class="explain-all" aria-pressed="false" title="Show or hide every explanation">Explain all</button><button type="button" data-all="open">Expand all</button><button type="button" data-all="close">Collapse all</button>
</div>
<div class="dgrid">
<nav class="tree" aria-label="Changed files">$tree</nav>
<div class="files">$files</div>
</div>
</section>
