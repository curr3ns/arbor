<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Implementation Reports</title>
<style>
:root{color-scheme:light;--bg:#f6f8fa;--card:#fff;--sunk:#f6f8fa;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--line2:#e6ebf1;--accent:#0969da;--accentbg:#ddf4ff;
--ok:#1a7f37;--okbg:#dafbe1;--warn:#9a6700;--warnbg:#fff8c5;--bad:#cf222e;--badbg:#ffebe9;
--addbg:#e6ffec;--addn:#ccffd8;--addmk:#aceebb;--delbg:#ffebe9;--deln:#ffd7d5;--delmk:#ffb3ab;--hunkbg:#ddf4ff;--hunkfg:#0550ae;--void:#f6f8fa;--shadow:0 1px 2px rgba(31,35,40,.06)}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d1117;--card:#151b23;--sunk:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#30363d;--line2:#21262d;--accent:#4493f8;--accentbg:#14294a;
--ok:#3fb950;--okbg:#12301c;--warn:#d29922;--warnbg:#3a2d0a;--bad:#f85149;--badbg:#3d1618;
--addbg:rgba(46,160,67,.15);--addn:rgba(46,160,67,.32);--addmk:rgba(46,160,67,.45);--delbg:rgba(248,81,73,.13);--deln:rgba(248,81,73,.3);--delmk:rgba(248,81,73,.45);--hunkbg:#121d2f;--hunkfg:#79c0ff;--void:#10151c;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1480px;margin:0 auto;padding:0 24px}
header.top{background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 0}
h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}.sub{color:var(--muted);font-size:13px}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:13.5px;font-weight:550}.btn:hover{background:var(--sunk);border-color:var(--muted)}
.icon{width:34px;padding:6px 0;text-align:center}
.tools{display:flex;gap:8px;align-items:center}
.filter{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;color:inherit;width:260px;max-width:100%}
main{padding:24px 0 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:clip}
table{width:100%;border-collapse:collapse}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk);font-weight:650}
td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:14px}
tr:last-child td{border:0}tbody tr:hover td{background:var(--sunk)}tr.hide{display:none}
td.tk a{font-weight:700;text-decoration:none;white-space:nowrap}td.tk a:hover{text-decoration:underline}
td .t{font-weight:600}td .s{color:var(--muted);margin-top:2px;font-size:13px;max-width:70ch}
.pill{display:inline-flex;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--sunk);color:var(--muted);margin:0 4px 4px 0;white-space:nowrap}
.pill.ok,.badge.pass{color:var(--ok);background:var(--okbg);border-color:transparent}.pill.warn,.badge.skip{color:var(--warn);background:var(--warnbg);border-color:transparent}.badge.fail{color:var(--bad);background:var(--badbg)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:650;margin-right:4px;white-space:nowrap}
th .sort{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center}th .sort:hover{color:var(--fg)}th .sort::after{content:"\2195";opacity:.35;font-size:11px}
th[aria-sort] .sort{color:var(--fg)}th[aria-sort=ascending] .sort::after{content:"\2191";opacity:1}th[aria-sort=descending] .sort::after{content:"\2193";opacity:1}
.empty{color:var(--muted);font-style:italic;padding:24px;text-align:center}
@media(max-width:900px){.wrap{padding:0 14px}th:nth-child(n+3),td:nth-child(n+3){display:none}.filter{width:150px}}
</style>
<script>try{var t=localStorage.getItem("rpt-theme");if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;if(localStorage.getItem("rpt-view")==="s")document.documentElement.dataset.view="s"}catch(e){}</script>
</head>
<body>
<header class="top"><div class="wrap"><div class="hrow">
<h1>Implementation reports</h1>
<div class="tools"><input class="filter" id="q" type="search" placeholder="Filter tickets…  ( / )" aria-label="Filter tickets"><button class="btn icon" id="theme" title="Toggle light / dark" aria-label="Toggle theme">&#9680;</button></div>
</div></div></header>
<main class="wrap">
<div class="card"><table>
<thead><tr><th data-k="ticket"><button class="sort">Ticket</button></th><th data-k="text"><button class="sort">Summary</button></th><th data-k="text"><button class="sort">Repos</button></th><th data-k="num"><button class="sort">Push</button></th><th data-k="num"><button class="sort">Tests</button></th><th data-k="num"><button class="sort">Hiccups</button></th><th data-k="text" aria-sort="descending"><button class="sort">Generated</button></th></tr></thead>
<tbody id="rows">
$rows
</tbody></table></div>
</main>
<script>
document.getElementById("theme").onclick=function(){var d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("rpt-theme",n)}catch(e){}};
var q=document.getElementById("q");
q.oninput=function(){var v=q.value.trim().toLowerCase();Array.prototype.forEach.call(document.querySelectorAll("#rows tr"),function(r){r.classList.toggle("hide",v&&r.textContent.toLowerCase().indexOf(v)<0)})};
var ths=document.querySelectorAll("thead th"),tb=document.getElementById("rows");
function val(r,i,k){var c=r.cells[i],v=c.dataset.v!=null?c.dataset.v:c.textContent.trim();return k==="num"?+v:v}
function sortBy(i,dir){var k=ths[i].dataset.k,rows=Array.prototype.slice.call(tb.rows);
rows.sort(function(a,b){var x=val(a,i,k),y=val(b,i,k),c=k==="num"?x-y:String(x).localeCompare(y,undefined,{numeric:k==="ticket",sensitivity:"base"});return dir==="ascending"?c:-c});
rows.forEach(function(r){tb.appendChild(r)});Array.prototype.forEach.call(ths,function(t,j){if(j===i)t.setAttribute("aria-sort",dir);else t.removeAttribute("aria-sort")})}
Array.prototype.forEach.call(ths,function(th,i){th.querySelector(".sort").onclick=function(){var d=th.getAttribute("aria-sort")==="ascending"?"descending":"ascending";sortBy(i,d);try{localStorage.setItem("rpt-sort",i+":"+d)}catch(e){}}});
try{var ss=(localStorage.getItem("rpt-sort")||"").split(":");if(ths[ss[0]]&&/^(a|de)scending$$/.test(ss[1]))sortBy(+ss[0],ss[1])}catch(e){}
addEventListener("keydown",function(e){if(e.key==="/"&&e.target.tagName!=="INPUT"){e.preventDefault();q.focus()}else if(e.key==="Escape")q.blur()});
</script>
</body></html>
